[project]
name = "pantry-planner"
version = "0.1.0"
description = "Smart Pantry Manager — starter web app for the AGY CLI + agents-cli codelab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "google-cloud-firestore>=2.19.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
